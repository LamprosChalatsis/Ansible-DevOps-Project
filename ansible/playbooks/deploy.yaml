---
# Παίρνει τα images που έχτισε και έκανε push το Jenkins (ghcr.io) και τα
# τρέχει στο appserver μέσω docker compose.
#
# Καλείται από το ansible.Jenkinsfile ως:
#   ansible-playbook -i hosts.yaml -e frontend_image=... -e backend_image=... playbooks/deploy.yaml
#
# Χρειάζεται δύο extra-vars: frontend_image, backend_image
 
- hosts: appservers
  become: yes
 
  vars:
    deploy_dir: /opt/medical-appointment-service
    backend_image: "ghcr.io/lamproschalatsis/medical-appointment-backend:latest"
    frontend_image: "ghcr.io/lamproschalatsis/medical-appointment-frontend:latest"
 
  tasks:
    - name: Ensure deployment directory exists
      file:
        path: "{{ deploy_dir }}"
        state: directory
        mode: '0755'
 
    # Χρειάζεται μόνο αν τα ghcr.io packages είναι PRIVATE.
    # Αν τα κάνεις public, μπορείς να σβήσεις αυτό το task.
    # Δώσε docker_user/docker_token ως extra επιπλέον -e στο Jenkinsfile.
    # - name: Login to GHCR
    #   shell: echo "{{ docker_token }}" | docker login ghcr.io -u "{{ docker_user }}" --password-stdin
    #   no_log: true
 
    - name: Render docker-compose.yml with the built image tags
      template:
        src: docker-compose.yml.j2
        dest: "{{ deploy_dir }}/docker-compose.yml"
 
    - name: Pull the latest images
      command: docker compose pull
      args:
        chdir: "{{ deploy_dir }}"
 
    - name: Start (or restart) the application stack
      command: docker compose up -d
      args:
        chdir: "{{ deploy_dir }}"