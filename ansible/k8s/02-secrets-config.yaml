apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: medical-appointment
type: Opaque
stringData:
  POSTGRES_DB: medical_appointments
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
 
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: medical-appointment
data:
  SPRING_MAIL_HOST: mailhog
  SPRING_MAIL_PORT: "1025"
  CORS_ALLOWED_ORIGINS: "http://localhost:3000"
 