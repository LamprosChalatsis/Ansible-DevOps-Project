apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: medical-appointment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/lamproschalatsis/medical-appointment-backend:latest
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://db:5432/medical_appointments
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: POSTGRES_PASSWORD
            - name: JWT_SECRET
              value: "43006d10d6fcc60abcd8f6e57955aadd75179e0b24c439568c4b4eae4bfa35dd"
          envFrom:
            - configMapRef:
                name: backend-config
 
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: medical-appointment
spec:
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080
